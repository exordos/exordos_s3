[tox]
envlist = begin,py3{10,11,12,13,14},end
          py3{10,11,12,13,14}-functional
          ruff,ruff-check,mypy
minversion = 2.0
skipsdist = false
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
extras =
  test
setenv =
  PACKAGE_NAME=exordos_s3
  TEST_PATH={env:PACKAGE_NAME}/tests/unit
  functional: TEST_PATH={env:PACKAGE_NAME}/tests/functional
pass_env =
  EXORDOS_*
  METAPAAS_*
  HOME
  NO_PROXY
  no_proxy
  HTTP_PROXY
  HTTPS_PROXY
  ALL_PROXY
commands =
  coverage run -p -m pytest {posargs} --timer-top-n=10 {env:TEST_PATH}

[testenv:begin]
runner = uv-venv-lock-runner
envdir = {toxworkdir}/cover
commands =
  coverage erase

[testenv:end]
runner = uv-venv-lock-runner
envdir = {toxworkdir}/cover
commands =
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml
  coverage report --skip-covered

[testenv:ruff-check]
extras =
  ruff
runner = uv-venv-lock-runner
commands = ruff check .

[testenv:ruff]
extras =
  ruff
runner = uv-venv-lock-runner
commands =
  ruff check . --fix
  ruff check --select I --fix
  ruff format

[testenv:mypy]
extras =
  mypy
runner = uv-venv-lock-runner
commands = mypy -p exordos_s3

[testenv:develop]
runner = uv-venv-lock-runner
extras =
  test
usedevelop = true

# Builds the distribution artifacts into ./dist. The version comes from the git
# tags via setuptools_scm, so the checkout must have its tags available.
[testenv:wheel]
extras =
  build
description = build the exordos_s3 wheel and sdist into dist/
runner = uv-venv-runner
skip_install = true
deps =
  build>=1.0.0
pass_env =
  HOME
  NO_PROXY
  no_proxy
  HTTP_PROXY
  HTTPS_PROXY
  ALL_PROXY
commands =
  python -m build --outdir {toxinidir}/dist {posargs}
