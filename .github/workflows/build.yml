name: build

on:
  push:
  pull_request:
    types: [opened]

jobs:
  Build:
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: exordos/exordos_ci/.github/workflows/element_build.yml@master
    secrets:
      PUSH_CFG: ${{ secrets.PUSH_CFG }}

  # End-to-end run on a realm, through exordos_ci's shared workflow: the
  # element built from this commit installed on it, then the functional suite
  # run on the realm itself, where the s3 data plane is reachable.
  E2E:
    needs: Build
    uses: exordos/exordos_ci/.github/workflows/element_realm_test.yml@master
    with:
      elements: s3aas
      version: ${{ needs.Build.outputs.version }}
      element-timeout: 600
      ssh: true
      overbook: true
      dependencies: metapaas
      check-script: .github/scripts/run-functional-in-realm.sh
    secrets: inherit
