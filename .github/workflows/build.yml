name: build

on:
  push:
  pull_request:
    types: [opened]

jobs:
  Build:
    runs-on: [self-hosted, vm]
    if: ${{ github.actor != 'dependabot[bot]' }}
    outputs:
      version: ${{ steps.build_element.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Element
        id: build_element
        env:
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
        run: |
          set -eux

          VERSION="$(exordos get-version .)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          exordos build $(pwd)

          # Decode and write the push configuration
          echo "$PUSH_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t local -f --latest

  # End-to-end run on a realm, through exordos_tests' shared workflow: the
  # element built from this commit installed on it, then the functional suite
  # run on the realm itself, where the s3 data plane is reachable.
  E2E:
    needs: Build
    uses: exordos/exordos_tests/.github/workflows/element_realm_test.yml@realm_ssh_input
    with:
      elements: s3aas
      version: ${{ needs.Build.outputs.version }}
      element-timeout: 600
      ssh: true
      prepare-script: .github/scripts/prepare-realm.sh
      check-script: .github/scripts/run-functional-in-realm.sh
      tests-ref: realm_ssh_input
    secrets: inherit
