name: build

on:
  push:
  pull_request:
    types: [opened]

env:
  PACKER_VERSION: "1.9.2"
  PYTHON_VERSION: "3.12"
  TOX_ENV: "py312"
  CORE_ENDPOINT_URL: http://10.20.0.2:80/api/core
  CORE_USERNAME: "admin"
  CORE_PASSWORD: "admin"
  # Address the CI VMs reach the artifact server (run by prepare_env.py on the
  # runner) at: 10.20.0.1 is the hypervisor host on the bootstrapped core CIDR.
  ARTIFACTS_HOST: "10.20.0.1"
  ARTIFACTS_PORT: "8081"

jobs:
  # Build and publish the element on the self-hosted builder, the same way
  # every other exordos element does it (see exordos_ecosystem).
  Build:
    runs-on: [self-hosted, vm]
    if: ${{ github.actor != 'dependabot[bot]' }}
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Element
        env:
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
        run: |
          set -eux

          exordos build $(pwd)

          # Decode and write the push configuration
          echo "$PUSH_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t local -f --latest
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: ${{ failure() }}
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 15

  # End-to-end run: a throwaway core on a GitHub runner, the element built from
  # this commit installed into it, then the functional suite. prepare_env.py
  # owns the whole environment setup so the same command works locally.
  E2E:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'dependabot[bot]' }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Install exordos CLI
        run: curl -fsSL https://repo.exordos.com/install.sh | sudo sh

      - name: Install hypervisor
        run: |
          sudo exordos compute hypervisors init
          sudo chmod 666 /dev/kvm

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv + tox + build
        uses: astral-sh/setup-uv@v7
      - run: |
          sudo apt-get update && sudo apt-get install --yes libev-dev
          uv tool install tox --with tox-uv
          pip install build

      - name: Bootstrap exordos_core
        timeout-minutes: 20
        run: |
          set -eux

          exordos settings set-realm default --endpoint $CORE_ENDPOINT_URL
          exordos settings set-context default --name default \
            --user $CORE_USERNAME --password $CORE_PASSWORD
          # --pool-agent-placement=core (the default since exordos CLI 3.2)
          # puts the pool agent inside core and has it reach libvirt over
          # qemu+tcp://10.20.0.1 — but `hypervisors init` configures the local
          # socket only ("skipping remote TCP setup"), so nothing ever creates
          # a machine and every node stays NEW. `local` installs the agent on
          # this runner, against the socket that init actually set up.
          exordos bootstrap -i latest -f -m core --pool-agent-placement local \
            --admin-password $CORE_PASSWORD --cidr 10.20.0.0/22

          for i in {1..60}; do
            exordos ready_api && break
            echo "Waiting for Exordos Core API... ($i/60)"
            sleep 5
          done
          exordos ready_api

          # The runner is a single small VM: let the hypervisor overbook so the
          # metapaas CP and the s3 dataplane both fit.
          HYPER_UUID="$(exordos c h l -o json | jq -r '.[0].uuid')"
          exordos compute hypervisors update $HYPER_UUID --cores-ratio 10.0 --ram-ratio 10.0

      # Builds the wheel and the element, serves both over HTTP, installs
      # metapaas + s3aas and waits until the s3 API answers.
      - name: Prepare test environment
        # The metapaas image is pulled from repo.exordos.com into the core, so
        # its element takes tens of minutes to reconcile on a GitHub runner.
        timeout-minutes: 80
        run: |
          set -euo pipefail
          python exordos_s3/tests/functional/prepare_env.py \
            --output-dir /tmp/s3aas-build \
            --http-host "$ARTIFACTS_HOST" \
            --http-port "$ARTIFACTS_PORT" \
            --endpoint "$CORE_ENDPOINT_URL" \
            --username "$CORE_USERNAME" \
            --password "$CORE_PASSWORD" \
            --wait-timeout 1800 \
            2>&1 | tee /tmp/prepare_env.log
          sed -n 's/^  export //p' /tmp/prepare_env.log >> $GITHUB_ENV

      - name: Run functional tests
        run: tox -e ${{ env.TOX_ENV }}-functional

      # The compute agent runs on this runner, so when a node will not come up
      # the reason is in its journal, not in the core API.
      - name: Collect hypervisor diagnostics
        if: failure()
        run: |
          set +e
          echo "===== running services ====="
          systemctl list-units --type=service --state=running --no-pager
          echo "===== agent processes ====="
          ps -ef | grep -iE "agent|libvirtd|qemu-system" | grep -v grep
          # `exordos compute hypervisors init` sets up a "local universal
          # agent", whose unit is not named after exordos.
          echo "===== agent journal ====="
          sudo journalctl -u '*agent*' --no-pager -n 400
          echo "===== libvirt journal ====="
          sudo journalctl -u libvirtd --no-pager -n 100
          echo "===== domains ====="
          sudo virsh list --all
          echo "===== disk / memory ====="
          df -h /
          free -m
          echo "===== image caches ====="
          sudo ls -lhR /var/lib/exordos 2>/dev/null | head -50
          ls -lh "$HOME/.cache/exordos" 2>/dev/null

      - name: Debug session on failure
        uses: owenthereal/action-upterm@v1
        if: failure()
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 5
